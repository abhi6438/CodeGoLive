specVersion: '3.0'
metadata:
  name: bookshop-ui
type: application
framework:
  name: OpenUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /catalog
      configuration:
        baseUri: "http://localhost:4004/catalog"
